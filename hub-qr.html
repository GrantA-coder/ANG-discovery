<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>African Grant — QR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700&family=DM+Mono:wght@400;500&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #1E2761;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 52px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 24px 80px rgba(0,0,0,0.3);
    }
    .tag {
      display: inline-block;
      background: rgba(29,158,117,0.12);
      color: #1D9E75;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      font-weight: 400;
      color: #1E2761;
      letter-spacing: 0.01em;
      line-height: 1.15;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #8892a4;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    #qrcode canvas, #qrcode img {
      border-radius: 12px;
      border: 6px solid #f4f6fb;
    }
    .url {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #aab0bf;
      word-break: break-all;
      margin-bottom: 32px;
      padding: 10px 16px;
      background: #f4f6fb;
      border-radius: 8px;
    }
    .divider { height: 1px; background: #eef0f6; margin-bottom: 24px; }
    .footer-brand { font-size: 13px; font-weight: 700; color: #1E2761; margin-bottom: 4px; }
    .footer-tag { font-size: 11px; color: #aab0bf; }
    .btn-print {
      margin-top: 24px;
      background: #1E2761;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-print:hover { background: #253080; }
    @media print {
      body { background: white; }
      .btn-print { display: none; }
      .card { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">African Grant</div>
    <h1>Scan to see what I build.</h1>
    <p>ANG Enterprises — AI systems &amp; automation. Culturati Printing — merch, print &amp; event space. Pick your lane.</p>

    <div id="qrcode"></div>

    <div class="url">granta-coder.github.io/ANG-discovery/</div>

    <div class="divider"></div>

    <div class="footer-brand">African Grant</div>
    <div class="footer-tag">ANG Enterprises &middot; Culturati Printing &middot; Youngstown, OH</div>

    <button class="btn-print" onclick="window.print()">Print / Save as PDF</button>
  </div>

  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://granta-coder.github.io/ANG-discovery/",
      width: 240,
      height: 240,
      colorDark: "#1E2761",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
